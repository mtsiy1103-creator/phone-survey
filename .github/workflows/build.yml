name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Test core logic
        run: ./gradlew :core:test --console=plain 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Build APK
        # The runner image ships with the Android SDK (ANDROID_HOME is set).
        run: ./gradlew :app:assembleRelease --console=plain 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Report errors as annotations
        if: failure()
        run: |
          cat test.log build.log 2>/dev/null | grep -E '^e: |error:|What went wrong|FAILED|Could not' -A2 | head -60 > errors.txt || true
          i=0
          while IFS= read -r line; do
            i=$((i+1))
            if [ $i -le 10 ]; then echo "::error::${line}"; else echo "::warning::${line}"; fi
          done < <(grep -v '^--$' errors.txt | head -20)
      - uses: actions/upload-artifact@v4
        with:
          name: phone-survey-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish APK as the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk phone-survey.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest phone-survey.apk --title "최신 빌드" \
            --notes "휴대폰에서 phone-survey.apk를 내려받아 설치하세요. 빌드: ${GITHUB_SHA::7}" --latest
